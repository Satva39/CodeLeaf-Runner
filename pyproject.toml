[project]
name = "codeleaf-runner"
version = "0.1.0"
description = "Private asynchronous code execution control plane for CodeLeaf, backed by self-hosted Piston."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "httpx>=0.27,<1.0",
  "redis>=5.0,<7.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0", "pytest-asyncio>=0.23,<2.0", "ruff>=0.6,<1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

# ARM64 overlay for the existing CodeLeaf Runner Compose topology.
# Keep docker-compose.yml and docker-compose.local.yml unchanged.
# The overlay does not publish new ports or change networks, credentials,
# privileges, resource limits, volumes, or service dependencies.

services:
  redis:
    platform: linux/arm64

  piston:
    ports:
      - "127.0.0.1:2001:2000"
    image: codeleaf-piston:arm64-validation
    platform: linux/arm64

  piston-admin:
    ports:
      - "127.0.0.1:2010:2000"
    platform: linux/arm64

  api:
    platform: linux/arm64
    build:
      args:
        RUNNER_PYTHON_BASE_IMAGE: python:3.12-slim

    ports:
      - "127.0.0.1:8081:8080"
    
  worker:
    platform: linux/arm64
    build:
      args:
        RUNNER_PYTHON_BASE_IMAGE: python:3.12-slim

  docker-gateway:
    platform: linux/arm64
    build:
      args:
        RUNNER_PYTHON_BASE_IMAGE: python:3.12-slim

  database-worker:
    container_name: codeleaf-runner-arm64-database-worker
    platform: linux/arm64
    build:
      args:
        RUNNER_PYTHON_BASE_IMAGE: python:3.12-slim
